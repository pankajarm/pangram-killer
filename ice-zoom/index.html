<title>Cold, All the Way Down — an ice cube in nine powers of ten</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  :root {
    --abyss: #040b14;
    --abyss-2: #071523;
    --glacier: #eaf6ff;
    --faint-ice: #9dbfd6;
    --meltwater: #7fd0f2;
    --deep-current: #123f63;
    --oxygen: #e8695a;

    --font-display: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
    --font-body: "Seravek", "Gill Sans", "Segoe UI", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "Consolas", "DejaVu Sans Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--abyss);
    color: var(--glacier);
    font-family: var(--font-body);
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
    cursor: ns-resize;
  }

  /* ---------- HUD chrome ---------- */

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header {
    padding: 28px 32px 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }

  .masthead .kicker {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--meltwater);
    text-transform: uppercase;
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(15px, 2vw, 19px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    margin-top: 6px;
    text-wrap: balance;
  }

  .hint {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--faint-ice);
    text-align: right;
    line-height: 1.7;
    opacity: 0.85;
  }
  .hint b { color: var(--glacier); font-weight: 500; }

  /* ---------- depth rail ---------- */

  .rail {
    position: fixed;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    height: min(56vh, 460px);
    display: flex;
    align-items: stretch;
    gap: 10px;
    pointer-events: none;
  }

  .rail .line {
    position: relative;
    width: 1px;
    background: linear-gradient(var(--deep-current), var(--meltwater), var(--deep-current));
    opacity: 0.6;
  }

  .rail .marker {
    position: absolute;
    left: 50%;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--meltwater);
    box-shadow: 0 0 12px var(--meltwater), 0 0 3px var(--glacier);
    transform: translate(-50%, -50%);
    transition: top 0.12s linear;
  }

  .rail .ticks {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--faint-ice);
    letter-spacing: 0.04em;
  }
  .rail .ticks span { line-height: 1; opacity: 0.75; font-variant-numeric: tabular-nums; }

  /* ---------- level card ---------- */

  footer {
    padding: 0 32px 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
  }

  .card { max-width: 46ch; }

  .card .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--meltwater);
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .card h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(26px, 4.4vw, 44px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 8px 0 4px;
    text-wrap: balance;
    line-height: 1.05;
  }

  .card .size {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--meltwater);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  .card p {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--faint-ice);
    max-width: 44ch;
  }

  .card .inner {
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .card .inner.swap {
    opacity: 0;
    transform: translateY(8px);
    transition: none;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .controls button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--deep-current);
    background: rgba(7, 21, 35, 0.75);
    color: var(--glacier);
    font-family: var(--font-mono);
    font-size: 17px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .controls button:hover { border-color: var(--meltwater); }
  .controls button:focus-visible {
    outline: none;
    border-color: var(--meltwater);
    box-shadow: 0 0 0 3px rgba(127, 208, 242, 0.25);
  }

  .dots { display: flex; gap: 7px; align-items: center; }

  .dots button {
    width: 8px;
    height: 8px;
    padding: 0;
    border-radius: 4px;
    border: none;
    background: var(--deep-current);
    transition: background 0.2s, height 0.2s;
  }
  .dots button.on {
    background: var(--meltwater);
    height: 20px;
    box-shadow: 0 0 8px rgba(127, 208, 242, 0.5);
  }
  .dots button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(127, 208, 242, 0.3);
  }

  @media (max-width: 720px) {
    header { padding: 20px 20px 0; }
    footer { padding: 0 20px 22px; flex-direction: column; align-items: stretch; }
    .controls { justify-content: center; }
    .hint { display: none; }
    .rail { right: 14px; height: 40vh; }
    .rail .ticks { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card .inner, .rail .marker { transition: none; }
  }

  /* record mode: clean cinematic chrome for video capture */
  :root.record .hint,
  :root.record #btnIn,
  :root.record #btnOut { display: none; }
  :root.record .card .inner { transition: none; }
  :root.record .rail .marker { transition: none; }
  :root.record #scene { cursor: none; }
</style>

<canvas id="scene" aria-label="Zoomable view of an ice cube, from the whole cube down to a single oxygen atom"></canvas>

<div class="hud">
  <header>
    <div class="masthead">
      <div class="kicker">10⁻² m &rarr; 10⁻¹⁰ m</div>
      <h1>Cold, All the Way Down</h1>
    </div>
    <div class="hint">
      <b>scroll</b> to dive &middot; <b>&uarr; &darr;</b> keys<br>
      drag or pinch on touch
    </div>
  </header>

  <div></div>

  <footer>
    <div class="card">
      <div class="inner" id="cardInner">
        <div class="eyebrow" id="lvEyebrow">Level 1 / 9</div>
        <h2 id="lvName">The Ice Cube</h2>
        <div class="size" id="lvSize">3 cm · 10⁻² m</div>
        <p id="lvDesc"></p>
      </div>
    </div>
    <div class="controls" role="group" aria-label="Zoom controls">
      <button id="btnOut" aria-label="Zoom out one level">&minus;</button>
      <div class="dots" id="dots"></div>
      <button id="btnIn" aria-label="Zoom in one level">+</button>
    </div>
  </footer>
</div>

<div class="rail" aria-hidden="true">
  <div class="ticks" id="railTicks"></div>
  <div class="line"><div class="marker" id="railMarker"></div></div>
</div>

<script>
'use strict';

/* ================= level data ================= */

const LEVELS = [
  { name: 'The Ice Cube', size: '3 cm · 10⁻² m', log: -1.52,
    desc: 'An ordinary cube from the freezer — about 10²³ water molecules locked in place at −18 °C. Everything below is hiding inside it.' },
  { name: 'The Surface', size: '1 mm · 10⁻³ m', log: -3,
    desc: 'Not glass-smooth at all. Frost blooms, hairline cracks and haze scatter light in every direction — the reason ice looks white instead of clear.' },
  { name: 'Trapped Air', size: '100 µm · 10⁻⁴ m', log: -4,
    desc: 'Cloudy pockets of air seized mid-escape. As water freezes it expels dissolved gas, and the advancing ice front seals it into bubbles.' },
  { name: 'Crystal Grains', size: '10 µm · 10⁻⁵ m', log: -5,
    desc: 'Ice is not one crystal but a patchwork of many, each grain frozen in its own orientation, meeting its neighbors along bright boundary walls.' },
  { name: 'One Crystal', size: '1 µm · 10⁻⁶ m', log: -6,
    desc: 'Inside a single grain, order takes over: six-fold symmetry, the same geometry that shapes every snowflake that has ever fallen.' },
  { name: 'The Lattice', size: '10 nm · 10⁻⁸ m', log: -8,
    desc: 'Hexagonal rings repeating in every direction — ice Ih. The honeycomb is open and airy, which is why ice is less dense than water, and why it floats.' },
  { name: 'Hydrogen Bonds', size: '1 nm · 10⁻⁹ m', log: -9,
    desc: 'Each molecule grips four neighbors through hydrogen bonds — strong enough to build a lattice, weak enough to melt in your hand.' },
  { name: 'One Molecule', size: '0.28 nm · 10⁻⁹·⁵ m', log: -9.55,
    desc: 'H₂O — one oxygen, two hydrogens, bent at 104.5°. That lopsided shape and its uneven charge are the source of nearly everything water does.' },
  { name: 'The Atom', size: '0.1 nm · 10⁻¹⁰ m', log: -10,
    desc: 'An oxygen atom: eight electrons blurred into a probability cloud around a nucleus 100,000 times smaller still. Mostly, the cold is empty space.' },
];

const N = LEVELS.length;
const ZOOM_FACTOR = 8;               // apparent magnification between adjacent levels
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= seeded randomness ================= */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= canvas setup ================= */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

/* ================= zoom state ================= */

let z = 0;            // rendered zoom position, 0 .. N-1
let targetZ = 0;

function clampZ(v) { return Math.max(0, Math.min(N - 1, v)); }

addEventListener('wheel', e => {
  e.preventDefault();
  const gain = e.ctrlKey ? 0.008 : 0.0022;   // ctrl+wheel = trackpad pinch
  targetZ = clampZ(targetZ + e.deltaY * gain);
}, { passive: false });

let touches = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  const prev = touches.get(e.pointerId);
  if (touches.size === 1) {
    targetZ = clampZ(targetZ + (prev.y - e.clientY) * 0.006);
  }
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist) targetZ = clampZ(targetZ + (d - pinchDist) * 0.008);
    pinchDist = d;
  }
});
function endPointer(e) { touches.delete(e.pointerId); pinchDist = 0; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') {
    targetZ = clampZ(Math.round(targetZ) + 1); e.preventDefault();
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
    targetZ = clampZ(Math.round(targetZ) - 1); e.preventDefault();
  } else if (e.key >= '1' && e.key <= '9') {
    targetZ = +e.key - 1;
  } else if (e.key === 'Home') { targetZ = 0;
  } else if (e.key === 'End')  { targetZ = N - 1; }
});

document.getElementById('btnIn').addEventListener('click', () => {
  targetZ = clampZ(Math.round(targetZ) + 1);
});
document.getElementById('btnOut').addEventListener('click', () => {
  targetZ = clampZ(Math.round(targetZ) - 1);
});

/* dots */
const dotsWrap = document.getElementById('dots');
const dots = LEVELS.map((lv, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', `Level ${i + 1}: ${lv.name}`);
  b.addEventListener('click', () => { targetZ = i; });
  dotsWrap.appendChild(b);
  return b;
});

/* depth rail ticks: 10⁻² … 10⁻¹⁰ */
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const railTicks = document.getElementById('railTicks');
for (let e = 2; e <= 10; e += 2) {
  const s = document.createElement('span');
  s.textContent = '10' + ('-' + e).split('').map(c => SUP[c]).join('');
  railTicks.appendChild(s);
}
const railMarker = document.getElementById('railMarker');
const LOG_TOP = -2, LOG_BOT = -10;

/* ================= HUD updates ================= */

const cardInner = document.getElementById('cardInner');
const elEyebrow = document.getElementById('lvEyebrow');
const elName = document.getElementById('lvName');
const elSize = document.getElementById('lvSize');
const elDesc = document.getElementById('lvDesc');
let shownLevel = -1;

function setCard(i) {
  const lv = LEVELS[i];
  elEyebrow.textContent = `Level ${i + 1} / ${N}`;
  elName.textContent = lv.name;
  elSize.textContent = lv.size;
  elDesc.textContent = lv.desc;
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
}

function updateHUD() {
  const i = clampZ(Math.round(z));
  if (i !== shownLevel) {
    shownLevel = i;
    if (RECORD) {
      setCard(i);
    } else {
      cardInner.classList.add('swap');
      setCard(i);
      requestAnimationFrame(() => requestAnimationFrame(() =>
        cardInner.classList.remove('swap')));
    }
  }
  /* rail marker */
  const i0 = Math.floor(z), f = z - i0;
  const lg = LEVELS[i0].log + (LEVELS[Math.min(i0 + 1, N - 1)].log - LEVELS[i0].log) * f;
  const p = Math.max(0, Math.min(1, (lg - LOG_TOP) / (LOG_BOT - LOG_TOP)));
  railMarker.style.top = (p * 100) + '%';
}
setCard(0);
shownLevel = 0;

/* ================= per-level static data ================= */

const rng = mulberry32(20260729);
const rnd = (a, b) => a + rng() * (b - a);

/* L0: mist particles */
const mist = Array.from({ length: 26 }, () => ({
  x: rnd(-1.3, 1.3), y: rnd(-1.2, 1.2), r: rnd(0.01, 0.045),
  sp: rnd(0.02, 0.07), ph: rnd(0, 7),
}));
/* L0: internal bubbles of the cube */
const cubeBubbles = Array.from({ length: 14 }, () => ({
  x: rnd(-0.34, 0.34), y: rnd(-0.3, 0.38), r: rnd(0.006, 0.02),
}));

/* L1: frost surface — grains, cracks, pores */
const frostDots = Array.from({ length: 260 }, () => ({
  x: rnd(-1.4, 1.4), y: rnd(-1.4, 1.4), r: rnd(0.003, 0.014), a: rnd(0.04, 0.3),
}));
const frostCracks = Array.from({ length: 34 }, () => {
  let x = rnd(-1.3, 1.3), y = rnd(-1.3, 1.3);
  const pts = [[x, y]];
  let ang = rnd(0, Math.PI * 2);
  for (let s = 0, n = 3 + (rng() * 4 | 0); s < n; s++) {
    ang += rnd(-0.9, 0.9);
    x += Math.cos(ang) * rnd(0.08, 0.3);
    y += Math.sin(ang) * rnd(0.08, 0.3);
    pts.push([x, y]);
  }
  return { pts, a: rnd(0.06, 0.28) };
});
const frostPores = Array.from({ length: 40 }, () => ({
  x: rnd(-1.4, 1.4), y: rnd(-1.4, 1.4), r: rnd(0.012, 0.05), a: rnd(0.1, 0.4),
}));

/* L2: bubble field */
const bubbles = [{ x: 0.02, y: -0.04, r: 0.46, hero: true }]
  .concat(Array.from({ length: 9 }, () => ({
    x: rnd(-1.2, 1.2), y: rnd(-1.2, 1.2), r: rnd(0.05, 0.2), hero: false,
  })));
const streaks = Array.from({ length: 22 }, () => ({
  x: rnd(-1.5, 1.5), y: rnd(-1.5, 1.5), len: rnd(0.3, 1.2),
  ang: rnd(-0.5, -0.2), a: rnd(0.02, 0.1),
}));

/* L3: voronoi grains */
const grainSeeds = Array.from({ length: 15 }, () => ({
  x: rnd(-1.35, 1.35), y: rnd(-1.35, 1.35), l: rnd(0.10, 0.24), h: rnd(198, 214),
}));
function clipPoly(poly, mx, my, dx, dy) {
  const out = [];
  const side = p => (p[0] - mx) * dx + (p[1] - my) * dy;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const fa = side(a), fb = side(b);
    if (fa <= 0) out.push(a);
    if ((fa < 0 && fb > 0) || (fa > 0 && fb < 0)) {
      const t = fa / (fa - fb);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}
const grainCells = grainSeeds.map((s, i) => {
  const B = 1.7;
  let poly = [[-B, -B], [B, -B], [B, B], [-B, B]];
  for (let j = 0; j < grainSeeds.length; j++) {
    if (j === i || !poly.length) continue;
    const o = grainSeeds[j];
    poly = clipPoly(poly, (s.x + o.x) / 2, (s.y + o.y) / 2, o.x - s.x, o.y - s.y);
  }
  return poly;
});

/* L4: dendrite arm plan (shared by all six arms) */
const armBranches = [];
for (let d = 0.18; d < 0.96; d += rnd(0.07, 0.13)) {
  armBranches.push({ d, len: (1 - d) * rnd(0.24, 0.42), w: (1 - d) * 2.4 + 0.6 });
}

/* L5: honeycomb lattice nodes + bonds */
const hexNodes = [], hexBonds = [];
{
  const b = 0.17;                       // bond length (fraction of R)
  const keys = new Map();
  const key = (x, y) => (Math.round(x * 1000) + ',' + Math.round(y * 1000));
  const addNode = (x, y) => {
    const k = key(x, y);
    if (!keys.has(k)) {
      keys.set(k, hexNodes.length);
      hexNodes.push({ x, y, ph: rnd(0, 7), f: rnd(1.5, 3.5) });
    }
    return keys.get(k);
  };
  const w = b * Math.sqrt(3);
  for (let row = -6; row <= 6; row++) {
    for (let col = -6; col <= 6; col++) {
      const cx = col * w + (row % 2 ? w / 2 : 0);
      const cy = row * b * 1.5;
      if (Math.hypot(cx, cy) > 1.55) continue;
      /* hexagon around (cx,cy) */
      const ids = [];
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 6 + k * Math.PI / 3;
        ids.push(addNode(cx + Math.cos(a) * b, cy + Math.sin(a) * b));
      }
      for (let k = 0; k < 6; k++) {
        const a = ids[k], c = ids[(k + 1) % 6];
        const bk = a < c ? a + '-' + c : c + '-' + a;
        if (!keys.has('b' + bk)) { keys.set('b' + bk, 1); hexBonds.push([a, c]); }
      }
    }
  }
}

/* L6: molecular cluster */
const cluster = [{ x: 0, y: 0, s: 1, rot: rnd(0, 7) }];
for (let k = 0; k < 6; k++) {
  const a = k * Math.PI / 3 + 0.3;
  cluster.push({
    x: Math.cos(a) * rnd(0.5, 0.62),
    y: Math.sin(a) * rnd(0.5, 0.62),
    s: rnd(0.75, 1), rot: rnd(0, 7),
  });
}
cluster.forEach(m => { m.ph = rnd(0, 7); });

/* L8: electron cloud sample points (two shells) */
const cloud = [];
for (let k = 0; k < 480; k++) {
  const shell = k < 130 ? 0.26 : 0.72;
  const spread = k < 130 ? 0.07 : 0.22;
  const a = rng() * Math.PI * 2;
  const r = shell + (rng() + rng() - 1) * spread;
  cloud.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, a: rnd(0.03, 0.22), ph: rnd(0, 7) });
}
const electrons = Array.from({ length: 8 }, (_, k) => ({
  r: k < 2 ? 0.26 : 0.72, ph: rnd(0, 7), sp: rnd(0.25, 0.6) * (k % 2 ? 1 : -1),
}));

/* ================= drawing helpers ================= */

function glow(x, y, r, inner, outer) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, inner);
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

/* Every level draws in a centered space where R = content radius. */

function drawCube(R, t) {
  const a = R * 0.58, d = R * 0.30;
  const wob = REDUCED ? 0 : Math.sin(t * 0.4) * 0.02;

  glow(0, 0, R * 1.5, 'rgba(90,160,210,0.16)', 'rgba(90,160,210,0)');

  /* mist */
  ctx.fillStyle = 'rgba(160,205,235,0.5)';
  for (const m of mist) {
    const my = ((m.y - t * m.sp * (REDUCED ? 0 : 1)) % 2.4 + 2.4) % 2.4 - 1.2;
    ctx.save();
    ctx.globalAlpha *= 0.10 + 0.08 * Math.sin(t + m.ph);
    ctx.beginPath();
    ctx.arc(m.x * R, my * R, m.r * R * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.rotate(wob);
  ctx.translate(-d * 0.45, d * 0.35);

  /* top face */
  let g = ctx.createLinearGradient(0, -a, d, -a - d);
  g.addColorStop(0, 'rgba(225,243,255,0.95)');
  g.addColorStop(1, 'rgba(150,200,235,0.85)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-a, -a); ctx.lineTo(a, -a);
  ctx.lineTo(a + d, -a - d); ctx.lineTo(-a + d, -a - d);
  ctx.closePath(); ctx.fill();

  /* right face */
  g = ctx.createLinearGradient(a, 0, a + d, -d);
  g.addColorStop(0, 'rgba(105,160,205,0.9)');
  g.addColorStop(1, 'rgba(70,120,170,0.9)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(a, -a); ctx.lineTo(a + d, -a - d);
  ctx.lineTo(a + d, a - d); ctx.lineTo(a, a);
  ctx.closePath(); ctx.fill();

  /* front face */
  g = ctx.createLinearGradient(-a, -a, a, a);
  g.addColorStop(0, 'rgba(190,225,250,0.92)');
  g.addColorStop(0.55, 'rgba(140,190,230,0.88)');
  g.addColorStop(1, 'rgba(100,155,205,0.9)');
  ctx.fillStyle = g;
  ctx.fillRect(-a, -a, a * 2, a * 2);

  /* interior bubbles */
  ctx.fillStyle = 'rgba(235,248,255,0.55)';
  for (const b of cubeBubbles) {
    ctx.beginPath();
    ctx.arc(b.x * R, b.y * R, b.r * R, 0, Math.PI * 2);
    ctx.fill();
  }

  /* specular streak */
  g = ctx.createLinearGradient(-a, -a, -a * 0.1, a * 0.4);
  g.addColorStop(0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.08)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-a, -a); ctx.lineTo(-a * 0.15, -a);
  ctx.lineTo(-a * 0.62, a * 0.55); ctx.lineTo(-a, a * 0.15);
  ctx.closePath(); ctx.fill();

  /* edges */
  ctx.strokeStyle = 'rgba(240,250,255,0.7)';
  ctx.lineWidth = R * 0.006;
  ctx.strokeRect(-a, -a, a * 2, a * 2);
  ctx.beginPath();
  ctx.moveTo(-a, -a); ctx.lineTo(-a + d, -a - d); ctx.lineTo(a + d, -a - d);
  ctx.lineTo(a + d, a - d); ctx.lineTo(a, a);
  ctx.moveTo(a, -a); ctx.lineTo(a + d, -a - d);
  ctx.stroke();
  ctx.restore();
}

function drawFrost(R, t) {
  glow(0, 0, R * 1.6, 'rgba(120,175,215,0.14)', 'rgba(30,60,90,0)');

  /* granular texture */
  for (const p of frostDots) {
    ctx.save();
    ctx.globalAlpha *= p.a;
    ctx.fillStyle = '#dcefff';
    ctx.beginPath();
    ctx.arc(p.x * R, p.y * R, p.r * R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  /* pores */
  for (const p of frostPores) {
    ctx.save();
    ctx.globalAlpha *= p.a * 0.6;
    const g = ctx.createRadialGradient(p.x * R, p.y * R, 0, p.x * R, p.y * R, p.r * R);
    g.addColorStop(0, 'rgba(10,25,40,0.9)');
    g.addColorStop(1, 'rgba(10,25,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x * R, p.y * R, p.r * R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  /* cracks */
  ctx.lineCap = 'round';
  for (const c of frostCracks) {
    ctx.save();
    ctx.globalAlpha *= c.a * (0.85 + (REDUCED ? 0 : 0.15 * Math.sin(t * 0.7 + c.pts[0][0] * 5)));
    ctx.strokeStyle = '#bfe2f8';
    ctx.lineWidth = R * 0.004;
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0] * R, c.pts[0][1] * R);
    for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i][0] * R, c.pts[i][1] * R);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBubbles(R, t) {
  /* streaky ice background */
  ctx.lineCap = 'round';
  for (const s of streaks) {
    ctx.save();
    ctx.globalAlpha *= s.a;
    ctx.strokeStyle = '#a9d4ee';
    ctx.lineWidth = R * 0.012;
    ctx.beginPath();
    ctx.moveTo(s.x * R, s.y * R);
    ctx.lineTo((s.x + Math.cos(s.ang) * s.len) * R, (s.y + Math.sin(s.ang) * s.len) * R);
    ctx.stroke();
    ctx.restore();
  }
  for (const b of bubbles) {
    const wob = REDUCED ? 0 : Math.sin(t * 1.1 + b.x * 9) * 0.008;
    const r = (b.r + wob * b.r) * R, x = b.x * R, y = b.y * R;
    /* interior */
    let g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, 'rgba(200,232,252,0.10)');
    g.addColorStop(0.8, 'rgba(40,80,120,0.10)');
    g.addColorStop(1, 'rgba(150,205,240,0.30)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    /* rim */
    ctx.strokeStyle = b.hero ? 'rgba(196,232,252,0.85)' : 'rgba(170,210,240,0.5)';
    ctx.lineWidth = r * 0.045;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    /* highlight arc */
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = r * 0.06;
    ctx.beginPath(); ctx.arc(x, y, r * 0.8, -2.4, -1.5); ctx.stroke();
  }
}

function drawGrains(R, t) {
  for (let i = 0; i < grainCells.length; i++) {
    const poly = grainCells[i];
    if (poly.length < 3) continue;
    const s = grainSeeds[i];
    ctx.fillStyle = `hsl(${s.h} 42% ${(s.l * 100) | 0}%)`;
    ctx.beginPath();
    ctx.moveTo(poly[0][0] * R, poly[0][1] * R);
    for (let k = 1; k < poly.length; k++) ctx.lineTo(poly[k][0] * R, poly[k][1] * R);
    ctx.closePath();
    ctx.fill();
    const shimmer = REDUCED ? 0.55 : 0.45 + 0.25 * Math.sin(t * 0.8 + i * 1.7);
    ctx.strokeStyle = `rgba(158,215,245,${shimmer})`;
    ctx.lineWidth = R * 0.008;
    ctx.stroke();
  }
  /* frosted vignette so grains read as lit from within */
  glow(0, 0, R * 1.5, 'rgba(190,230,255,0.10)', 'rgba(5,12,20,0)');
}

function drawDendrite(R, t) {
  glow(0, 0, R * 1.35, 'rgba(120,190,235,0.13)', 'rgba(120,190,235,0)');
  const pulse = REDUCED ? 0.75 : 0.65 + 0.2 * Math.sin(t * 0.9);
  /* faint bounding hexagon */
  ctx.save();
  ctx.globalAlpha *= 0.22;
  ctx.strokeStyle = '#7fd0f2';
  ctx.lineWidth = R * 0.004;
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3 - Math.PI / 2;
    const x = Math.cos(a) * R * 1.02, y = Math.sin(a) * R * 1.02;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  ctx.lineCap = 'round';
  for (let arm = 0; arm < 6; arm++) {
    ctx.save();
    ctx.rotate(arm * Math.PI / 3 - Math.PI / 2);
    /* main spine */
    ctx.save();
    ctx.globalAlpha *= pulse;
    ctx.strokeStyle = '#d8f0ff';
    ctx.lineWidth = R * 0.016;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R, 0); ctx.stroke();
    ctx.restore();
    /* side branches at 60° */
    for (const br of armBranches) {
      for (const sgn of [-1, 1]) {
        ctx.save();
        ctx.globalAlpha *= pulse * 0.85;
        ctx.strokeStyle = '#aadcf5';
        ctx.lineWidth = R * 0.0035 * br.w;
        ctx.beginPath();
        ctx.moveTo(br.d * R, 0);
        ctx.lineTo((br.d + br.len * 0.5) * R, sgn * br.len * 0.87 * R);
        ctx.stroke();
        ctx.restore();
      }
    }
    /* tip node */
    glow(R, 0, R * 0.05, 'rgba(230,248,255,0.9)', 'rgba(230,248,255,0)');
    ctx.restore();
  }
  glow(0, 0, R * 0.09, 'rgba(240,250,255,0.95)', 'rgba(240,250,255,0)');
}

function drawLattice(R, t) {
  const jit = REDUCED ? () => 0 : (n) => Math.sin(t * n.f + n.ph) * 0.008;
  const pos = hexNodes.map(n => [
    (n.x + jit(n)) * R,
    (n.y + Math.cos(t * n.f * 0.9 + n.ph) * (REDUCED ? 0 : 0.008)) * R,
  ]);
  const fade = (x, y) => Math.max(0, 1 - Math.hypot(x, y) / (R * 1.5));

  ctx.lineCap = 'round';
  for (const [a, b] of hexBonds) {
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    ctx.save();
    ctx.globalAlpha *= 0.5 * fade((x1 + x2) / 2, (y1 + y2) / 2);
    ctx.strokeStyle = '#6fb9dd';
    ctx.lineWidth = R * 0.010;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < hexNodes.length; i++) {
    const [x, y] = pos[i];
    const f = fade(x, y);
    if (f <= 0) continue;
    ctx.save();
    ctx.globalAlpha *= f;
    glow(x, y, R * 0.055, 'rgba(220,242,255,0.9)', 'rgba(120,190,230,0)');
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath(); ctx.arc(x, y, R * 0.020, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawMolecule(x, y, scale, rot, R) {
  const rO = 0.115 * scale * R, rH = 0.058 * scale * R, bond = 0.155 * scale * R;
  const half = 104.5 * Math.PI / 360;
  const hs = [
    [x + Math.cos(rot - half) * bond, y + Math.sin(rot - half) * bond],
    [x + Math.cos(rot + half) * bond, y + Math.sin(rot + half) * bond],
  ];
  /* O–H bonds */
  ctx.strokeStyle = 'rgba(230,240,250,0.55)';
  ctx.lineWidth = rH * 0.7;
  ctx.lineCap = 'round';
  for (const [hx, hy] of hs) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
  }
  /* hydrogens */
  for (const [hx, hy] of hs) {
    const g = ctx.createRadialGradient(hx - rH * 0.3, hy - rH * 0.3, 0, hx, hy, rH);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#b9cfe0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(hx, hy, rH, 0, Math.PI * 2); ctx.fill();
  }
  /* oxygen */
  const g = ctx.createRadialGradient(x - rO * 0.35, y - rO * 0.35, 0, x, y, rO);
  g.addColorStop(0, '#f7a08f');
  g.addColorStop(0.6, '#e8695a');
  g.addColorStop(1, '#a83c33');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rO, 0, Math.PI * 2); ctx.fill();
  return hs;
}

function drawCluster(R, t) {
  glow(0, 0, R * 1.4, 'rgba(80,140,190,0.10)', 'rgba(80,140,190,0)');
  const placed = cluster.map(m => {
    const jx = REDUCED ? 0 : Math.sin(t * 1.6 + m.ph) * 0.014;
    const jy = REDUCED ? 0 : Math.cos(t * 1.3 + m.ph * 2) * 0.014;
    return { x: (m.x + jx) * R, y: (m.y + jy) * R, s: m.s, rot: m.rot };
  });
  /* hydrogen bonds: dashed center-to-center from the hub */
  ctx.setLineDash([R * 0.02, R * 0.025]);
  ctx.strokeStyle = 'rgba(127,208,242,0.5)';
  ctx.lineWidth = R * 0.008;
  for (let i = 1; i < placed.length; i++) {
    const a = placed[0], b = placed[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
    const m1 = 0.16 * R, m2 = 0.16 * R * b.s;
    ctx.beginPath();
    ctx.moveTo(a.x + ux * m1, a.y + uy * m1);
    ctx.lineTo(b.x - ux * m2, b.y - uy * m2);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const m of placed) drawMolecule(m.x, m.y, m.s, m.rot, R);
}

function drawSingleMolecule(R, t) {
  glow(0, 0.1 * R, R * 1.3, 'rgba(232,105,90,0.07)', 'rgba(232,105,90,0)');
  const breathe = REDUCED ? 1 : 1 + Math.sin(t * 1.2) * 0.01;

  /* lone-pair electron haze opposite the hydrogens */
  for (const sgn of [-1, 1]) {
    ctx.save();
    ctx.globalAlpha *= 0.35;
    glow(sgn * R * 0.28, R * 0.42, R * 0.3,
      'rgba(127,208,242,0.35)', 'rgba(127,208,242,0)');
    ctx.restore();
  }

  ctx.save();
  ctx.scale(breathe * 2.6, breathe * 2.6);
  const hs = drawMolecule(0, R * 0.045, 1, -Math.PI / 2, R);
  ctx.restore();

  /* bond-angle arc + label */
  const half = 104.5 * Math.PI / 360;
  ctx.strokeStyle = 'rgba(157,191,214,0.65)';
  ctx.lineWidth = R * 0.005;
  ctx.setLineDash([R * 0.014, R * 0.014]);
  ctx.beginPath();
  ctx.arc(0, R * 0.12, R * 0.62, -Math.PI / 2 - half, -Math.PI / 2 + half);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#9dbfd6';
  ctx.font = `500 ${R * 0.075}px "SF Mono", Consolas, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('104.5°', 0, -R * 0.56);
  /* partial charges */
  ctx.fillStyle = 'rgba(232,150,138,0.9)';
  ctx.fillText('δ−', 0, R * 0.62);
  ctx.fillStyle = 'rgba(214,232,246,0.9)';
  ctx.fillText('δ+', -R * 0.52, -R * 0.30);
  ctx.fillText('δ+', R * 0.52, -R * 0.30);
}

function drawAtom(R, t) {
  glow(0, 0, R * 1.4, 'rgba(90,150,200,0.10)', 'rgba(90,150,200,0)');

  /* probability cloud */
  for (const p of cloud) {
    ctx.save();
    ctx.globalAlpha *= p.a * (REDUCED ? 1 : 0.7 + 0.3 * Math.sin(t * 2 + p.ph));
    ctx.fillStyle = '#bfe2f8';
    ctx.beginPath();
    ctx.arc(p.x * R, p.y * R, R * 0.012, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  /* shell hints */
  for (const r of [0.26, 0.72]) {
    ctx.save();
    ctx.globalAlpha *= 0.14;
    ctx.strokeStyle = '#7fd0f2';
    ctx.lineWidth = R * 0.004;
    ctx.beginPath(); ctx.arc(0, 0, r * R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  /* eight electrons */
  for (const e of electrons) {
    const a = REDUCED ? e.ph : e.ph + t * e.sp;
    const x = Math.cos(a) * e.r * R, y = Math.sin(a) * e.r * R;
    glow(x, y, R * 0.045, 'rgba(220,245,255,0.95)', 'rgba(127,208,242,0)');
  }
  /* nucleus — deliberately tiny */
  glow(0, 0, R * 0.10, 'rgba(255,214,190,0.9)', 'rgba(255,150,110,0)');
  ctx.fillStyle = '#fff2e8';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.014, 0, Math.PI * 2); ctx.fill();
}

const DRAWS = [drawCube, drawFrost, drawBubbles, drawGrains,
  drawDendrite, drawLattice, drawCluster, drawSingleMolecule, drawAtom];

/* ================= render loop ================= */

const t0 = performance.now();
function smooth(a, b, x) {
  const u = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

function renderOnce(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* background: deepens with descent */
  const depth = z / (N - 1);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
  bg.addColorStop(0, `rgba(${13 - depth * 6 | 0}, ${33 - depth * 16 | 0}, ${52 - depth * 24 | 0}, 1)`);
  bg.addColorStop(1, '#02060c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const R = Math.min(W, H) * 0.36;
  const i = Math.min(Math.floor(z), N - 1);
  const f = z - i;

  /* outgoing level grows past the viewer */
  const aOut = 1 - smooth(0.30, 0.88, f);
  if (aOut > 0.003) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(Math.pow(ZOOM_FACTOR, f), Math.pow(ZOOM_FACTOR, f));
    ctx.globalAlpha = aOut;
    DRAWS[i](R, t);
    ctx.restore();
  }
  /* incoming level resolves out of the detail */
  if (f > 0.001 && i + 1 < N) {
    const aIn = smooth(0.10, 0.72, f);
    if (aIn > 0.003) {
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(Math.pow(ZOOM_FACTOR, f - 1), Math.pow(ZOOM_FACTOR, f - 1));
      ctx.globalAlpha = aIn;
      DRAWS[i + 1](R, t);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  updateHUD();
}

function frame(now) {
  const t = (now - t0) / 1000;
  z += (targetZ - z) * (REDUCED ? 0.2 : 0.085);
  if (Math.abs(targetZ - z) < 0.0004) z = targetZ;
  renderOnce(t);
  requestAnimationFrame(frame);
}

const RECORD = new URLSearchParams(location.search).has('record');
if (RECORD) {
  document.documentElement.classList.add('record');
  /* drive one deterministic frame from outside: __seek(zoom, seconds) */
  window.__seek = (zv, tSec) => { z = targetZ = clampZ(zv); renderOnce(tSec); };
} else {
  requestAnimationFrame(frame);
}
</script>
